    <script>
      (function() {
        // Suppress Vite HMR WebSocket connection errors in cloud sandbox environment (HMR is disabled)
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')))) {
              const fakeWs = new EventTarget();
              fakeWs.binaryType = 'blob';
              fakeWs.readyState = 1; // WebSocket.OPEN
              fakeWs.url = String(url);
              fakeWs.protocol = 'vite-hmr';
              fakeWs.extensions = '';
              fakeWs.bufferedAmount = 0;
              fakeWs.send = function() {};
              fakeWs.close = function() {
                fakeWs.readyState = 3; // CLOSED
              };
              setTimeout(function() {
                fakeWs.dispatchEvent(new Event('open'));
              }, 10);
              return fakeWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress any stray console error from @vite/client
        const origConsoleError = console.error;
        console.error = function(...args) {
          const str = args.map(function(a) { return (a && (a.message || a.stack)) || String(a); }).join(' ');
          if (
            str.includes('WebSocket closed without opened') ||
            (str.includes('WebSocket') && str.includes('@vite/client'))
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            (event.message?.includes('WebSocket') ||
             event.filename?.includes('@vite/client') ||
             event.message?.includes('closed without opened'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            (event.reason?.message?.includes('WebSocket') ||
             event.reason?.stack?.includes('@vite/client') ||
             event.reason?.message?.includes('closed without opened'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
